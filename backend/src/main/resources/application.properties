spring.application.name=vehicle-tracking
server.port=${PORT:8080}

# In-memory H2 database (data is lost on restart)
spring.datasource.url=jdbc:h2:mem:trackingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Comma-separated list of origins allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Moves MOVING vehicles along their routes so the tracker looks live
tracking.simulation.enabled=true
